<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop stop-color="#090d16" />
      <stop offset="1" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="glow" x1="16" y1="6" x2="22" y2="20" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38bdf8" />
      <stop offset="1" stop-color="#2563eb" />
    </linearGradient>
  </defs>

  <!-- Arxa fon: Premium tünd squircle -->
  <rect width="32" height="32" rx="8" fill="url(#bg)" />
  <rect x="0.5" y="0.5" width="31" height="31" rx="7.5" stroke="#1e293b" />

  <!-- Sütun 1: Baza Sistem Slaş-ı — Təmiz ağ, kəskin xətt -->
  <line
    x1="10.5"
    y1="23"
    x2="15.5"
    y2="9"
    stroke="#FFFFFF"
    stroke-width="3.2"
    stroke-linecap="round"
  />

  <!-- Sütun 2: +1 Sürüşməsi (Offset) — 1 addım sağa və yuxarı yüksəlmiş reaktiv qat -->
  <line
    x1="16.5"
    y1="20"
    x2="21.5"
    y2="6"
    stroke="url(#glow)"
    stroke-width="3.2"
    stroke-linecap="round"
  />

  <!-- Canlı Nəbz / Offset Balans Nöqtəsi -->
  <circle cx="21" cy="22" r="1.75" fill="#38bdf8" />
</svg>
